<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Cloner | Final Fixed Edition</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="styleheet" herf="style/style.css">
</head>
<body>

    <div class="overlay-blur"></div>
    <div id="loader"></div>

    <header>
        <div class="brand"><i class="fas fa-bolt"></i> MASTER CLONER</div>
        <div class="input-wrapper">
            <input type="url" id="target-url" placeholder="أدخل رابط الموقع (مثل: https://google.com)">
            <button class="btn-glow" id="clone-btn" onclick="runClone()">استنساخ شامل</button>
        </div>
    </header>

    <main>
        <aside>
            <div class="glass-panel" style="height: 110px;">
                <div class="label"><i class="fas fa-sitemap"></i> المسار</div>
                <div class="file-item active"><i class="fas fa-folder-open" style="color:#ffd700"></i> project_root</div>
            </div>
            <div class="glass-panel" style="flex: 1;">
                <div class="label"><i class="fas fa-box-open"></i> الموارد المستخرجة</div>
                <div id="file-list">
                    <div style="text-align: center; opacity: 0.4; margin-top: 30px; font-size: 0.8rem;">
                        انتظار إدخال الرابط...
                    </div>
                </div>
            </div>
        </aside>

        <section class="editor">
            <div class="editor-top">
                <span id="file-name">جاهز للعمل</span>
                <div style="display: flex; gap: 15px; opacity: 0.6; font-size: 0.8rem;">
                    <span><i class="fas fa-circle" style="color: #ff5f56"></i></span>
                    <span><i class="fas fa-circle" style="color: #ffbd2e"></i></span>
                    <span><i class="fas fa-circle" style="color: #27c93f"></i></span>
                </div>
            </div>
            <pre><code id="code-box" class="language-html"></code></pre>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        async function runClone() {
            const url = document.getElementById('target-url').value.trim();
            const btn = document.getElementById('clone-btn');
            const loader = document.getElementById('loader');

            if (!url) return alert("برجاء إدخال رابط صحيح يبدأ بـ http أو https");

            btn.disabled = true;
            btn.innerText = "جاري التحليل...";
            loader.style.width = "30%";

            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                loader.style.width = "70%";

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "حدث خطأ غير معروف");
                }

                const data = await response.json();
                loader.style.width = "100%";
                
                if (data.files && data.files.length > 0) {
                    renderSidebar(data.files);
                } else {
                    alert("لم يتم العثور على ملفات برمجية في هذا الرابط");
                }

            } catch (err) {
                alert("فشل الاستنساخ: " + err.message);
                loader.style.width = "0%";
            } finally {
                btn.disabled = false;
                btn.innerText = "استنساخ شامل";
                setTimeout(() => loader.style.width = "0%", 1000);
            }
        }

        function renderSidebar(files) {
            const list = document.getElementById('file-list');
            list.innerHTML = "";

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                
                // تحديد الأيقونة واللون بناءً على نوع الملف
                let icon = 'fa-file-code'; 
                let color = '#fff';
                
                if (file.name.endsWith('.html')) { icon = 'fa-html5'; color = '#e34c26'; }
                else if (file.name.endsWith('.css')) { icon = 'fa-css3-alt'; color = '#264de4'; }
                else if (file.name.endsWith('.js')) { icon = 'fa-js'; color = '#f7df1e'; }
                else if (file.name.includes('image') || file.name.includes('asset')) { icon = 'fa-image'; color = '#4caf50'; }
                else if (file.name.includes('video')) { icon = 'fa-video'; color = '#ff5722'; }

                item.innerHTML = `<i class="fab ${icon} fas" style="color: ${color}"></i> ${file.name}`;
                
                item.onclick = () => {
                    document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    updateEditor(file);
                };
                
                list.appendChild(item);
                if (index === 0) item.click(); // عرض أول ملف تلقائياً
            });
        }

        function updateEditor(file) {
            const box = document.getElementById('code-box');
            document.getElementById('file-name').innerText = `Viewing: ${file.name}`;
            
            // تحديد لغة التظليل
            const ext = file.name.split('.').pop();
            let lang = 'html';
            if (ext === 'js') lang = 'javascript';
            if (ext === 'css') lang = 'css';

            box.className = `language-${lang}`;
            box.textContent = file.content;
            
            // إعادة تفعيل Prism لتلوين الكود الجديد
            Prism.highlightAll();
        }
    </script>
</body>
</html>
