<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Cloner | Final Fixed Edition</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --cyan: #00f2ff;
            --purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.15);
            --bg-black: #050508;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-black) url('https://w0.peakpx.com/wallpaper/593/631/HD-wallpaper-blue-purple-nebula-stars-background-cosmos-nebula.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* يمنع تمرير الصفحة كاملة للتركيز على الأجزاء الداخلية */
        }

        .overlay-blur {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(12px); background: rgba(0, 0, 0, 0.4); z-index: -1;
        }

        /* تخصيص شريط التمرير لجميع العناصر */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; box-shadow: 0 0 10px var(--cyan); }

        header {
            padding: 15px 25px; background: var(--glass);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            gap: 20px; backdrop-filter: blur(25px); z-index: 10;
        }

        .brand {
            font-weight: 900; font-size: 1.4rem;
            background: linear-gradient(to right, var(--cyan), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 12px;
        }

        .input-wrapper { flex: 1; max-width: 650px; display: flex; gap: 12px; }

        input {
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            padding: 12px 20px; border-radius: 12px; color: var(--cyan);
            outline: none; transition: 0.3s; font-size: 14px;
        }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        .btn-glow {
            background: linear-gradient(45deg, var(--purple), #4e00c2);
            border: none; color: white; padding: 0 30px; border-radius: 12px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(188, 19, 254, 0.4);
        }
        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(188, 19, 254, 0.6); }

        main {
            display: flex; flex: 1; padding: 20px; gap: 20px;
            overflow: hidden; /* الحاويات الداخلية هي التي ستتمرر */
        }

        aside { width: 320px; display: flex; flex-direction: column; gap: 20px; }

        .glass-panel {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 18px; display: flex;
            flex-direction: column; backdrop-filter: blur(20px);
            overflow: hidden;
        }

        .label {
            font-size: 0.75rem; color: var(--cyan); margin-bottom: 15px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        /* إصلاح التمرير في قائمة الملفات */
        #file-list {
            flex: 1;
            overflow-y: auto; /* يسمح بالتمرير العمودي للملفات */
            padding-right: 5px;
        }

        .file-item {
            padding: 12px 15px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
            font-size: 0.85rem; margin-bottom: 6px; transition: 0.2s;
            border: 1px solid transparent; white-space: nowrap;
        }
        .file-item:hover { background: rgba(255,255,255,0.08); }
        .file-item.active {
            background: rgba(0, 242, 255, 0.15); color: var(--cyan);
            border-color: rgba(0, 242, 255, 0.4);
        }

        /* محرّر الكود وإصلاح التمرير فيه */
        .editor {
            flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            border-radius: 25px; overflow: hidden; display: flex;
            flex-direction: column; backdrop-filter: blur(35px);
        }

        .editor-top {
            padding: 12px 25px; background: rgba(255,255,255,0.05);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        #file-name { color: var(--cyan); font-weight: bold; font-size: 0.9rem; }

        /* منطقة الكود الفعلية */
        #code-box {
            flex: 1;
            overflow: auto !important; /* يسمح بتمرير الكود الطويل جداً */
            padding: 20px;
            margin: 0;
            background: transparent !important;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            tab-size: 4;
            white-space: pre !important; /* يحافظ على تنسيق الأسطر */
        }

        #loader {
            position: fixed; top: 0; left: 0; height: 3px; width: 0;
            background: var(--cyan); box-shadow: 0 0 15px var(--cyan);
            z-index: 9999; transition: 0.4s ease;
        }

        @media (max-width: 900px) {
            main { flex-direction: column; overflow-y: auto; }
            aside { width: 100%; }
            .editor { min-height: 500px; }
        }
    </style>
</head>
<body>

    <div class="overlay-blur"></div>
    <div id="loader"></div>

    <header>
        <div class="brand"><i class="fas fa-bolt"></i> MASTER CLONER</div>
        <div class="input-wrapper">
            <input type="url" id="target-url" placeholder="أدخل رابط الموقع (مثل: https://google.com)">
            <button class="btn-glow" id="clone-btn" onclick="runClone()">استنساخ شامل</button>
        </div>
    </header>

    <main>
        <aside>
            <div class="glass-panel" style="height: 110px;">
                <div class="label"><i class="fas fa-sitemap"></i> المسار</div>
                <div class="file-item active"><i class="fas fa-folder-open" style="color:#ffd700"></i> project_root</div>
            </div>
            <div class="glass-panel" style="flex: 1;">
                <div class="label"><i class="fas fa-box-open"></i> الموارد المستخرجة</div>
                <div id="file-list">
                    <div style="text-align: center; opacity: 0.4; margin-top: 30px; font-size: 0.8rem;">
                        انتظار إدخال الرابط...
                    </div>
                </div>
            </div>
        </aside>

        <section class="editor">
            <div class="editor-top">
                <span id="file-name">جاهز للعمل</span>
                <div style="display: flex; gap: 15px; opacity: 0.6; font-size: 0.8rem;">
                    <span><i class="fas fa-circle" style="color: #ff5f56"></i></span>
                    <span><i class="fas fa-circle" style="color: #ffbd2e"></i></span>
                    <span><i class="fas fa-circle" style="color: #27c93f"></i></span>
                </div>
            </div>
            <pre><code id="code-box" class="language-html"></code></pre>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <script>
        async function runClone() {
            const url = document.getElementById('target-url').value.trim();
            const btn = document.getElementById('clone-btn');
            const loader = document.getElementById('loader');

            if (!url) return alert("برجاء إدخال رابط صحيح يبدأ بـ http أو https");

            btn.disabled = true;
            btn.innerText = "جاري التحليل...";
            loader.style.width = "30%";

            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                loader.style.width = "70%";

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || "حدث خطأ غير معروف");
                }

                const data = await response.json();
                loader.style.width = "100%";
                
                if (data.files && data.files.length > 0) {
                    renderSidebar(data.files);
                } else {
                    alert("لم يتم العثور على ملفات برمجية في هذا الرابط");
                }

            } catch (err) {
                alert("فشل الاستنساخ: " + err.message);
                loader.style.width = "0%";
            } finally {
                btn.disabled = false;
                btn.innerText = "استنساخ شامل";
                setTimeout(() => loader.style.width = "0%", 1000);
            }
        }

        function renderSidebar(files) {
            const list = document.getElementById('file-list');
            list.innerHTML = "";

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                
                // تحديد الأيقونة واللون بناءً على نوع الملف
                let icon = 'fa-file-code'; 
                let color = '#fff';
                
                if (file.name.endsWith('.html')) { icon = 'fa-html5'; color = '#e34c26'; }
                else if (file.name.endsWith('.css')) { icon = 'fa-css3-alt'; color = '#264de4'; }
                else if (file.name.endsWith('.js')) { icon = 'fa-js'; color = '#f7df1e'; }
                else if (file.name.includes('image') || file.name.includes('asset')) { icon = 'fa-image'; color = '#4caf50'; }
                else if (file.name.includes('video')) { icon = 'fa-video'; color = '#ff5722'; }

                item.innerHTML = `<i class="fab ${icon} fas" style="color: ${color}"></i> ${file.name}`;
                
                item.onclick = () => {
                    document.querySelectorAll('.file-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    updateEditor(file);
                };
                
                list.appendChild(item);
                if (index === 0) item.click(); // عرض أول ملف تلقائياً
            });
        }

        function updateEditor(file) {
            const box = document.getElementById('code-box');
            document.getElementById('file-name').innerText = `Viewing: ${file.name}`;
            
            // تحديد لغة التظليل
            const ext = file.name.split('.').pop();
            let lang = 'html';
            if (ext === 'js') lang = 'javascript';
            if (ext === 'css') lang = 'css';

            box.className = `language-${lang}`;
            box.textContent = file.content;
            
            // إعادة تفعيل Prism لتلوين الكود الجديد
            Prism.highlightAll();
        }
    </script>
</body>
</html>
